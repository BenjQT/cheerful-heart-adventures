<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="img/icons/favicon-48.png">
<link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cheerful Heart">
<meta name="format-detection" content="telephone=no">
<script src="core/pwa.js" defer></script>
<meta name="theme-color" content="#6ab8ff">
<title>The Lost Star Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap">
<style>
[hidden]{display:none!important}
html,body{margin:0}body{font-size:14px}img{max-width:100%}
.allgames{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));z-index:30;text-decoration:none}

/* Layout: full-screen voxel diorama; chunky wood-and-gold game HUD floats over it at the screen edges. */
:root{
  --sky-top:#78c2ff; --sky-bot:#e4f5ff;
  --ink:#2a1f3d; --cream:#fff8ea; --paper:#fffdf6;
  --wood:#a86b3a; --wood-d:#6e4322; --plank:#d9a066;
  --gold:#ffc93c; --gold-d:#d98f0b;
  --leaf:#5fb043; --leaf-d:#3c8228;
  --heart:#ff5c8d; --heart-d:#d63a6c;
  --sky:#3f8fe0; --sky-d:#2a68b0;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Fredoka','Nunito','Arial Rounded MT Bold',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 78%);font-family:var(--body);color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .8s}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px var(--ink)}
/* keyboard play: ring around the chosen star */
.kb-ring{position:fixed;z-index:4;left:0;top:0;width:clamp(64px,11vw,96px);aspect-ratio:1;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 4px var(--focus,#1a5cff),0 0 18px rgba(255,255,255,.8);transform:translate(-50%,-50%);pointer-events:none}
.kb-help{position:fixed;z-index:4;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:rgba(42,31,61,.75);color:#fff;font-weight:700;font-size:.85rem;padding:.3em .9em;border-radius:999px;pointer-events:none}

/* ---------- chunky buttons ---------- */
.btn{font-family:var(--display);font-size:clamp(1.05rem,3.6vw,1.35rem);letter-spacing:.02em;color:#fff;border:0;border-radius:12px;padding:.55em 1.15em .65em;background:var(--leaf);
  box-shadow:inset 0 -6px 0 var(--leaf-d),inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 rgba(42,31,61,.22);text-shadow:0 2px 0 rgba(0,0,0,.22);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--leaf-d),inset 0 3px 0 rgba(255,255,255,.35),0 2px 0 rgba(42,31,61,.22)}
.btn.gold{background:var(--gold);color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.45);box-shadow:inset 0 -6px 0 var(--gold-d),inset 0 3px 0 rgba(255,255,255,.5),0 5px 0 rgba(42,31,61,.22)}
.btn.sky{background:var(--sky);box-shadow:inset 0 -6px 0 var(--sky-d),inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 rgba(42,31,61,.22)}
.icon-btn{width:52px;height:52px;display:grid;place-items:center;border:0;border-radius:14px;background:var(--cream);color:var(--wood-d);
  box-shadow:inset 0 -5px 0 #e7cfa6,0 4px 0 rgba(42,31,61,.2)}
.icon-btn:active{transform:translateY(2px)}
.icon-btn svg{width:28px;height:28px}
.icon-btn.off{opacity:.55}

/* ---------- wood panel ---------- */
.panel{background:repeating-linear-gradient(180deg,var(--plank) 0 22px,#cf9558 22px 24px);border:4px solid var(--wood-d);border-radius:18px;
  box-shadow:inset 0 0 0 3px #e9b77f,0 10px 0 rgba(42,31,61,.25),0 18px 40px rgba(42,31,61,.25);padding:14px}
.card{background:var(--paper);border-radius:12px;box-shadow:inset 0 -4px 0 #ecdcbf}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto;z-index:20}
.overlay.dim{background:rgba(42,31,61,.28)}
.title-wrap{width:min(720px,100%);display:grid;gap:14px;justify-items:center}
.logo{text-align:center;line-height:.95}
.logo .eyebrow{display:inline-flex;align-items:center;gap:6px;font-family:var(--body);font-weight:700;font-size:clamp(.8rem,2.8vw,1rem);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--heart);padding:.35em .9em;border-radius:999px;box-shadow:inset 0 -3px 0 var(--heart-d)}
.logo h1{margin:.25em 0 0;font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,11vw,5.2rem);color:var(--gold);text-wrap:balance;
  -webkit-text-stroke:0;text-shadow:0 4px 0 var(--wood-d),3px 0 0 var(--wood-d),-3px 0 0 var(--wood-d),0 -3px 0 var(--wood-d),3px 3px 0 var(--wood-d),-3px 3px 0 var(--wood-d),3px -3px 0 var(--wood-d),-3px -3px 0 var(--wood-d),0 9px 0 rgba(42,31,61,.25)}
.menu{width:100%;display:grid;gap:12px}
.menu h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.15rem,4vw,1.5rem);color:#fff;text-shadow:0 2px 0 var(--wood-d);text-align:center}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hero-card{border:0;padding:10px 6px 10px;display:grid;justify-items:center;gap:4px;position:relative;transition:transform .15s}
.hero-card .pic{width:clamp(64px,20vw,104px);aspect-ratio:1;max-width:100%;border-radius:50%;background:#fff;border:5px solid var(--ring);overflow:hidden;box-shadow:0 4px 0 rgba(42,31,61,.15)}
.hero-card .pic img{width:100%;height:100%;object-fit:cover;display:block}
.hero-card .nm{font-family:var(--display);font-size:clamp(1rem,3.8vw,1.3rem);color:var(--ink)}
.hero-card .rl{font-size:clamp(.7rem,2.6vw,.85rem);font-weight:600;color:#8a6a4a}
.hero-card[aria-pressed="true"]{transform:translateY(-4px);background:#fff4c9;box-shadow:inset 0 -4px 0 var(--gold-d),0 0 0 4px var(--gold)}
.hero-card .lead{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:.8rem;background:var(--gold);color:var(--ink);padding:.2em .7em;border-radius:999px;box-shadow:inset 0 -2px 0 var(--gold-d);white-space:nowrap}
.hero-card[aria-pressed="false"] .lead{display:none}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.level-card{border:0;padding:10px 8px 12px;display:grid;justify-items:center;gap:2px;text-align:center;color:var(--ink);position:relative}
.level-card .range{font-family:var(--display);font-size:clamp(1.5rem,6vw,2.1rem);color:var(--sky-d);line-height:1.05;font-variant-numeric:tabular-nums}
.level-card .ln{font-weight:700;font-size:clamp(.78rem,2.9vw,.95rem);line-height:1.15;text-wrap:balance}
.level-card .sk{font-size:clamp(.68rem,2.5vw,.8rem);font-weight:600;color:#8a6a4a}
.level-card .won{display:flex;gap:2px;margin-top:2px;height:18px}
.level-card .won svg{width:18px;height:18px}
.level-card[disabled]{cursor:not-allowed;filter:grayscale(.85);opacity:.7}
.level-card[disabled] .range{color:#9a8f86}
.level-card .lock{position:absolute;top:6px;right:6px;width:22px;height:22px;color:var(--wood-d)}
@media (max-width:560px){.levels{grid-template-columns:repeat(2,1fr)}}
.hint-row{font-size:.85rem;font-weight:600;color:#fff;text-shadow:0 1px 0 var(--wood-d);text-align:center}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .spacer{flex:1}
.lvl-chip{font-family:var(--display);font-size:clamp(.9rem,3.2vw,1.15rem);color:#fff;background:rgba(42,31,61,.55);padding:.35em .9em;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.find{position:absolute;top:calc(env(safe-area-inset-top,0px) + 74px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--paper);border:4px solid var(--wood-d);border-radius:999px;padding:4px 18px 4px 6px;box-shadow:0 5px 0 rgba(42,31,61,.22)}
.find .lbl{font-family:var(--display);font-size:clamp(1.2rem,4.4vw,1.6rem);color:var(--wood-d)}
.find .bigstar{position:relative;width:clamp(58px,15vw,74px);aspect-ratio:1;display:grid;place-items:center}
.find .bigstar svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 0 var(--gold-d))}
.find .bigstar b{position:relative;font-family:var(--body);font-weight:700;font-size:clamp(1.35rem,5vw,1.8rem);color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
.find.pop{animation:pop .45s}
@keyframes pop{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.18)}100%{transform:translateX(-50%) scale(1)}}
.track{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.slot{width:clamp(30px,8.4vw,50px);aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:clamp(.95rem,3.6vw,1.3rem);font-variant-numeric:tabular-nums;color:#8a7a6a;background:rgba(255,253,246,.82);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);transition:transform .2s}
.slot.now{color:var(--ink);background:#fff;box-shadow:0 0 0 4px var(--heart),inset 0 -4px 0 rgba(0,0,0,.08);animation:bob 1s ease-in-out infinite}
.slot.got{background:var(--gold);color:var(--ink);box-shadow:inset 0 -4px 0 var(--gold-d)}
@keyframes bob{50%{transform:translateY(-4px)}}
.bubble{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + clamp(56px,13vw,80px));display:flex;align-items:flex-end;gap:8px;max-width:min(460px,calc(100% - 32px));transition:opacity .25s,transform .25s;pointer-events:none}
.bubble.hide{opacity:0;transform:translateY(10px)}
.bubble .face{flex:none;width:clamp(52px,14vw,68px);aspect-ratio:1;border-radius:50%;background:#fff;border:4px solid var(--ring,#fff);overflow:hidden;box-shadow:0 4px 0 rgba(42,31,61,.2)}
.bubble .face img{width:100%;height:100%;object-fit:cover;display:block}
.bubble .say{position:relative;background:var(--paper);border-radius:16px;padding:8px 14px 10px;box-shadow:0 4px 0 rgba(42,31,61,.18);min-width:0}
.bubble .say::before{content:"";position:absolute;left:-9px;bottom:14px;border:9px solid transparent;border-right-color:var(--paper);border-left:0}
.bubble .who{font-family:var(--display);font-size:.95rem;color:var(--ring,var(--heart))}
.bubble .txt{font-weight:600;font-size:clamp(.95rem,3.6vw,1.15rem);line-height:1.25}

/* ---------- win ---------- */
.win{width:min(480px,100%);text-align:center;display:grid;gap:12px;justify-items:center;animation:rise .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(30px) scale(.9);opacity:0}}
.win .card{padding:16px 14px 18px;width:100%;display:grid;gap:10px;justify-items:center}
.win h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(2rem,8vw,2.8rem);color:var(--gold);text-shadow:0 3px 0 var(--wood-d),2px 0 0 var(--wood-d),-2px 0 0 var(--wood-d),0 -2px 0 var(--wood-d)}
.win .stars3{display:flex;gap:8px}
.win .stars3 svg{width:clamp(44px,13vw,60px);height:auto;filter:drop-shadow(0 3px 0 var(--gold-d));animation:spinin .6s backwards}
.win .stars3 svg:nth-child(2){animation-delay:.15s}.win .stars3 svg:nth-child(3){animation-delay:.3s}
@keyframes spinin{from{transform:scale(0) rotate(-120deg)}}
.win .counted{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.win .counted span{min-width:2em;padding:.2em .3em;border-radius:8px;background:#fff4c9;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:inset 0 -3px 0 #f0d78a}
.win p{margin:0;font-weight:600;font-size:1.05rem}
.win .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.win .stars3 svg.dim{filter:grayscale(1) opacity(.35)}
.win .extra{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.win .extra:empty{display:none}
.win .extra span{font-family:var(--display);font-size:1rem;padding:.25em .9em;border-radius:999px;background:var(--gold);box-shadow:inset 0 -3px 0 var(--gold-d)}
.fadein{animation:fade .35s}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<link rel="stylesheet" href="css/theme.css"></head><body>
<canvas id="scene" aria-label="Whispering Woods game world"></canvas>

<!-- HUD -->
<div id="hud" hidden>
  <div class="topbar">
    <button class="icon-btn" id="homeBtn" aria-label="Back to menu"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg></button>
    <div class="lvl-chip" id="lvlChip">Starry Start</div>
    <div class="spacer"></div>
    <button class="icon-btn" id="repeatBtn" aria-label="Hear it again"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
    <button class="icon-btn" id="musicBtn" aria-label="Music on or off"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3z"/></svg></button>
  </div>
  <div class="find" id="find"><div class="bigstar"><svg viewBox="0 0 100 100"><path fill="#ffc93c" stroke="#6e4322" stroke-width="5" stroke-linejoin="round" d="M50 5l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 36l30-3z"/></svg><b id="findNum">1</b></div><span class="lbl" id="findLbl">Find star</span></div>
  <div class="bubble hide" id="bubble"><div class="face"><img id="bubbleImg" alt=""></div><div class="say"><div class="who" id="bubbleWho"></div><div class="txt" id="bubbleTxt"></div></div></div>

</div>

<!-- TITLE -->
<div class="overlay" id="title">
  <a class="icon-btn allgames" href="index.html" aria-label="All games"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg></a>
  <div class="title-wrap">
    <div class="logo">
      <span class="eyebrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>Cheerful Heart Academy</span>
      <h1>The Lost Star Map</h1>
    </div>
    <div class="panel menu">
      <h2>Who leads the way?</h2>
      <div class="heroes" id="heroes"></div>
      <h2>Pick an adventure</h2>
      <div class="levels" id="levels"></div>
      <div class="hint-row">Tap the stars in number order to rebuild the map. Turn the sound on!</div>
    </div>
  </div>
</div>

<!-- WIN -->
<div class="overlay dim" id="win" hidden>
  <div class="win panel">
    <div class="card" style="position:relative">
      <h2 id="winTitle">Star Map Found!</h2>
      <div class="stars3"><svg viewBox="0 0 100 100"><path fill="#ffc93c" stroke="#6e4322" stroke-width="5" stroke-linejoin="round" d="M50 5l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 36l30-3z"/></svg><svg viewBox="0 0 100 100"><path fill="#ffc93c" stroke="#6e4322" stroke-width="5" stroke-linejoin="round" d="M50 5l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 36l30-3z"/></svg><svg viewBox="0 0 100 100"><path fill="#ffc93c" stroke="#6e4322" stroke-width="5" stroke-linejoin="round" d="M50 5l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 36l30-3z"/></svg></div>
      <div class="extra" id="winExtra"></div>

    </div>

      <button class="btn gold" id="nextBtn">Next adventure</button>

      <button class="btn" id="menuBtn">Levels</button>

</div>

<script>
(function(){

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const lerp=(a,b,t)=>a+(b-a)*t;

const HAS_PLAYER=!!(window.CH&&CH.store&&CH.store.activeId());
function loadProg(){let v={};try{v=JSON.parse(localStorage.getItem('starmap-progress')||'{}')||{}}catch(e){}
  const base={unlocked:Math.max(1,v.unlocked|0),won:v.won||{},stars:{},leader:v.leader||'wynea',music:v.music!==false};
  if(HAS_PLAYER){const x=CH.store.getExtra('star-map')||{};const won={};(x.wonLevels||[]).forEach(k=>won[k]=true);
    base.won=won;base.stars=x.levelStars||{};base.unlocked=Math.max(1,x.unlocked|0)}
  return base}
function saveProg(){try{let v=prog;if(HAS_PLAYER){/* keep the old device record untouched (backup); only leader + music change */v=JSON.parse(localStorage.getItem('starmap-progress')||'{}')||{};v.leader=prog.leader;v.music=prog.music}localStorage.setItem('starmap-progress',JSON.stringify(v))}catch(e){}
  if(HAS_PLAYER)CH.store.setExtra('star-map',{wonLevels:Object.keys(prog.won).filter(k=>prog.won[k]).map(Number),unlocked:prog.unlocked,levelStars:prog.stars})}

  if(s.collected)return;
  if(s.n===curTarget())collect(s);else wrong(s);
}
function collect(s){
  if(wrongCount===0)firstTry++;credit+=(window.CH&&CH.config)?CH.config.creditFor(wrongCount):(wrongCount?0:1);s.collected=true;progress++;wrongCount=0;hintClock=0;
  stars.forEach(x=>{x.hinted=false;x.ar.visible=false});
  sfx.chime(progress-1);
  sparkle(s.grp.position.clone().add(new THREE.Vector3(0,.2,0)));
  s.bd.material.map=badgeTex(s.n,true);s.bd.material.needsUpdate=true;
  s.flash=1;
  if(lastCollected)addTrail(lastCollected.grp.position,s.grp.position);
  lastCollected=s;
  const L=heroes[leaderId];const dir=new THREE.Vector3(L.pos.x-s.grp.position.x,0,L.pos.z-s.grp.position.z);if(dir.lengthSq()<.01)dir.set(0,0,1);dir.normalize().multiplyScalar(1.05);
  L.target=new THREE.Vector3(s.grp.position.x+dir.x,0,s.grp.position.z+dir.z);L.hop=1;
  renderTrack();updateFind();
  const speaker=chain()[progress%3].id;
  if(progress>=level.seq.length){talk(speaker,`${s.n}! Woo-hoo! We found every star!`);winTimers.push(setTimeout(finishLevel,1600));return}
  const nx=curTarget(),praise=pick(PRAISE[speaker]);
  const line=`${s.n}! ${praise} Now find ${nx}!`;talk(speaker,line);
}
function wrong(s){
  s.shake=.6;sfx.boop();wrongCount++;hintClock=Math.max(hintClock,4);
  const n=curTarget();const who=chain()[1].id;
  const line=`Oopsie! That one is ${s.n}. We need ${n}!`;talk(who,line);
  if(wrongCount>=2)setTimeout(()=>{if(state==='play'&&curTarget()===n)hint()},1800);
}
let hintsUsed=0,levelStartedAt=Date.now(),hiddenMs=0,hiddenAt=0,levelSaved=false;
/* play time = time on screen; leaving mid-level records a "stopped early" session */
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt){hiddenMs+=Date.now()-hiddenAt;hiddenAt=0}});
const levelSec=()=>Math.round((Date.now()-levelStartedAt-hiddenMs-(hiddenAt?Date.now()-hiddenAt:0))/1000);
function saveEarly(){if(levelSaved||state!=='play'||(progress===0&&wrongCount===0&&hintsUsed===0))return;levelSaved=true;
  if(HAS_PLAYER)CH.store.recordSession('star-map',{startedAt:new Date(levelStartedAt).toISOString(),durationSec:levelSec(),correct:firstTry,total:level.seq.length,answered:progress,hintsUsed,completed:false,level:level.name})}
addEventListener('pagehide',saveEarly);
function hint(){
  const n=curTarget();const s=stars.find(x=>x.n===n&&!x.collected);if(!s)return;if(!s.hinted)hintsUsed++;
  s.hinted=true;s.ar.visible=true;hintClock=0;
  const prev=progress>0?level.seq[progress-1]:null;let line;
  if(prev===null)line=`Hmm, where is ${n}? Follow the pink arrow!`;
  else if(level.dir>0)line=`What comes after ${prev}? It's ${n}! Follow the pink arrow!`;
  else line=`Counting down! After ${prev} comes ${n}! Follow the pink arrow!`;
  const who=chain()[2].id;talk(who,line);
}
function addTrail(a,b){const N=9;for(let k=1;k<N;k++){const t=k/N;const m=new THREE.Mesh(new THREE.BoxGeometry(.11,.11,.11),new THREE.MeshBasicMaterial({color:0xffe27a}));m.position.set(lerp(a.x,b.x,t),lerp(a.y,b.y,t)+Math.sin(t*Math.PI)*.8,lerp(a.z,b.z,t));m.scale.setScalar(.001);worldGroup.add(m);trail.push(m);setTimeout(()=>tween(.3,v=>m.scale.setScalar(Math.max(.001,v*(1+Math.sin(v*Math.PI)*.6)))),k*45)}}

function finishLevel(){
  state='recount';$('#find').hidden=true;
  const ordered=level.seq.map(n=>stars.find(s=>s.n===n));
  chain().forEach(h=>{h.target=null;h.cheer=.01});
  const intro=level.dir>0?'Let’s count them together!':'Let’s count down together!';
  talk(leaderId,intro);
  const gap=BEAT*1000,start=(secToNext(1)+BEAT*3)*1000;
  ordered.forEach((s,k)=>{let lit=false;const light=()=>{if(lit)return;lit=true;s.flash=1.2;sparkle(s.grp.position,0xfff2a8,18,2);sfx.chime(k);const slots=$('#track').children;if(slots[k]){slots[k].style.transform='scale(1.3)';setTimeout(()=>slots[k].style.transform='',300)}};
    winTimers.push(setTimeout(()=>{say(String(s.n)+'!',true,null,chain()[k%3].id);const h=chain()[k%3];h.talk=.5;h.hop=1},Math.max(0,start+k*gap-SPEECH_LAG*1000)));winTimers.push(setTimeout(light,start+k*gap))});
  const end=start+ordered.length*gap+300;
  if(level.dir<0)winTimers.push(setTimeout(()=>{say('Three, two, one... Blast off!',true,null,'matthew');sfx.whoosh();for(let k=0;k<6;k++)setTimeout(()=>sparkle(new THREE.Vector3((Math.random()-.5)*W*.7,7+Math.random()*3,(Math.random()-.5)*D*.5),[0xff8ac0,0xffe066,0x9fd8ff,0xc6a8ff][k%4],70,5,.3),k*260)},end));
  winTimers.push(setTimeout(()=>{const st=levelStars();sfx.fanfare();burstConfetti();chain().forEach(h=>h.cheer=4);if(st===3){endfx.applause(4.5);endfx.fireworks(6,k=>sparkle(new THREE.Vector3((Math.random()-.5)*W*.7,7+Math.random()*3,(Math.random()-.5)*D*.5),[0xff8ac0,0xffe066,0x9fd8ff,0xc6a8ff,0x9dff9a,0xffb070][k%6],90,5.5,.32))}},end+(level.dir<0?900:0)));
  winTimers.push(setTimeout(showWin,end+(level.dir<0?2100:1300)));
  {const st=levelStars();lastResult=null;if(HAS_PLAYER){levelSaved=true;lastResult=CH.store.recordSession('star-map',{startedAt:new Date(levelStartedAt).toISOString(),durationSec:levelSec(),correct:firstTry,total:level.seq.length,hintsUsed,stars:st,completed:true,level:level.name})}
    prog.stars[levelIdx]=Math.max(prog.stars[levelIdx]||0,st)}
  prog.won[levelIdx]=true;prog.unlocked=Math.max(prog.unlocked,Math.min(LEVELS.length,levelIdx+2));saveProg(); // finishing a level always opens the next
}
let lastResult=null;
function showWin(){
  state='win';$('#hud').hidden=true;const last=levelIdx===LEVELS.length-1;const right=firstTry,tot=level.seq.length,stars=levelStars();
  [...document.querySelectorAll('#win .stars3 svg')].forEach((sv,k)=>sv.classList.toggle('dim',k>=stars));
  const range=level.dir>0?`from ${level.seq[0]} to ${level.seq[tot-1]}`:`down from ${level.seq[0]} to ${level.seq[tot-1]}`;
  const wc=$('#winCounted');wc.innerHTML='';level.seq.forEach(n=>{const s=document.createElement('span');s.textContent=n;wc.appendChild(s)});
  const r=lastResult||{},sticker=!!r.newSticker,pb=!!(r.personalBest&&!r.firstCompletion);
  $('#winExtra').innerHTML=(pb?'<span>Personal best!</span>':'')+(sticker?'<span>New sticker!</span>':'');
  $('#winTitle').textContent=stars===3?(last?'Map Complete!':'Star Map Found!'):stars===2?'Great counting!':'You did it!';
  $('#winMsg').textContent=`You counted ${range}! ${right} of ${tot} on the first try.`;
  $('#nextBtn').textContent=last?'All levels':'Next level';$('#nextBtn').hidden=false;$('#againBtn').textContent='Play again';
  const word=stars===1?'one star':stars+' stars';
  const msg=(stars===3?(right===tot?'Perfect score! ':'')+(last?'Hooray! You finished every level! You are a counting superstar!':'Hooray! The star map is back together!'):stars===2?'Great counting! The star map is back together!':'You did it! You found every star!')
    +` You earned ${word}!`+(sticker?' And you got a new sticker!':'')+(pb?' That’s your personal best!':'');
  $('#win').hidden=false;setTimeout(()=>$('#nextBtn').focus(),300);say(msg,true,null,leaderId);
  setTimeout(()=>{if(!$('#win').hidden&&window.CH&&CH.breakTime)CH.breakTime.check()},7000);
}
function goTitle(){
  saveEarly();
  winTimers.forEach(clearTimeout);winTimers=[];if(window.CH&&CH.voice)CH.voice.cancel();
  state='title';$('#hud').hidden=true;$('#win').hidden=true;$('#title').hidden=false;
  const defs=buildWorld({seq:[],seed:5});applyTheme('morning');spawnStars(defs);placeHeroes();fitCamera();
  if(confetti){scene.remove(confetti.mesh);confetti=null}
  renderMenu();
}

/* ================= menu ================= */
const starSVG='<svg viewBox="0 0 100 100"><path fill="#ffc93c" stroke="#6e4322" stroke-width="6" stroke-linejoin="round" d="M50 5l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 36l30-3z"/></svg>';
const lockSVG='<svg class="lock" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 10V8a6 6 0 1 1 12 0v2h1v12H5V10zm2 0h8V8a4 4 0 0 0-8 0z"/></svg>';
function renderMenu(){
  const hs=$('#heroes');hs.innerHTML='';
  ORDER.forEach(id=>{const I=HERO_INFO[id];const b=document.createElement('button');b.className='card hero-card';b.id='hero-'+id;b.setAttribute('aria-pressed',String(id===leaderId));b.style.setProperty('--ring',I.ring);
    b.innerHTML=`<span class="lead">Leader</span><span class="pic"><img src="${PORTRAIT[id]}" alt=""></span><span class="nm">${I.name}</span><span class="rl">${I.role}</span>`;
    b.onclick=()=>{ensureAudio();sfx.pop();leaderId=id;prog.leader=id;saveProg();renderMenu();placeHeroes();const h=heroes[id];h.cheer=1.6;const line={ali:'Hi! I’m Ali. I’ll lead the way!',wynea:'I’m Wynea! Let’s go explore!',matthew:'Matthew here! My star finder is ready!'}[id];say(line,false,null,id);h.talk=2};hs.appendChild(b)});
  const lv=$('#levels');lv.innerHTML='';
  LEVELS.forEach((L,k)=>{const locked=k+1>prog.unlocked;const b=document.createElement('button');b.className='card level-card';b.id='level-'+k;b.disabled=locked;
    const r=L.seq[0]+'–'+L.seq[L.seq.length-1];
    b.innerHTML=`${locked?lockSVG:''}<span class="range">${r}</span><span class="ln">${L.name}</span><span class="sk">${L.skill}</span><span class="won">${prog.won[k]?starSVG.repeat(prog.stars[k]||3):''}</span>`;
    b.setAttribute('aria-label',`${L.name}, ${L.skill}${locked?', locked':''}`);
    b.onclick=()=>{ensureAudio();sfx.pop();startLevel(k)};lv.appendChild(b)});
}

/* ================= input ================= */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{
  ensureAudio();
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  if(state==='play'){const hits=ray.intersectObjects(stars.filter(s=>!s.collected).map(s=>s.hit),false);if(hits.length){onStarTap(hits[0].object.userData.star);return}}
  const hh=ray.intersectObjects(ORDER.map(i=>heroes[i].root),true);
  if(hh.length){const id=hh[0].object.userData.hero;if(id){const h=heroes[id];h.cheer=1.6;sfx.pop();const line={ali:'Hi! I’m Ali. You’re doing great!',wynea:'I’m Wynea! Let’s keep exploring!',matthew:'Beep boop! Matthew’s star power!'}[id];if(state==='play')talk(id,line);else{say(line,false,null,id);h.talk=2}}}
});
$('#homeBtn').onclick=()=>{sfx.pop();goTitle()};
$('#repeatBtn').onclick=()=>{ensureAudio();if(state!=='play')return;const n=curTarget();if(n===undefined)return;hint()};
$('#musicBtn').onclick=()=>{ensureAudio();setMusic(!musicOn)};
/* iOS/Android: pause sound in the background, wake it on the next tap */
document.addEventListener('visibilitychange',()=>{if(!actx)return;if(document.hidden){try{actx.suspend()}catch(e){}}});
addEventListener('pointerdown',()=>{if(actx&&actx.state!=='running')try{actx.resume()}catch(e){}},true);
/* ---------- keyboard play ----------
   Arrow keys move a ring between the stars (left to right on screen),
   Enter or Space taps it. Number keys tap that star directly (type 1 then 2 for 12). */
const kbRing=document.createElement('div');kbRing.className='kb-ring';kbRing.hidden=true;document.body.appendChild(kbRing);
const kbHelp=document.createElement('div');kbHelp.className='kb-help';kbHelp.hidden=true;kbHelp.textContent='← → choose a star · Enter to tap';document.body.appendChild(kbHelp);
const kbLive=document.createElement('div');kbLive.className='ch-sr';kbLive.setAttribute('aria-live','polite');document.body.appendChild(kbLive);
let kbStar=null,kbBuf='',kbBufT=0;const kbV=new THREE.Vector3();
function starScreen(st){st.grp.getWorldPosition(kbV);kbV.project(camera);return{x:(kbV.x+1)/2*innerWidth,y:(1-kbV.y)/2*innerHeight}}
function kbMove(d){const list=stars.filter(x=>!x.collected).map(x=>({x,p:starScreen(x)})).sort((a,b)=>a.p.x-b.p.x).map(o=>o.x);if(!list.length)return;
  let i=list.indexOf(kbStar);i=i<0?(d>0?0:list.length-1):(i+d+list.length)%list.length;kbStar=list[i];kbHelp.hidden=false;kbLive.textContent='Star '+kbStar.n;sfx.pop&&sfx.pop()}
addEventListener('keydown',e=>{
  if(state!=='play'||document.querySelector('.ch-modal')||e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if(k==='ArrowRight'||k==='ArrowDown'){e.preventDefault();ensureAudio();kbMove(1)}
  else if(k==='ArrowLeft'||k==='ArrowUp'){e.preventDefault();ensureAudio();kbMove(-1)}
  else if((k==='Enter'||k===' ')&&kbStar&&!kbStar.collected&&!(e.target&&e.target.closest&&e.target.closest('button'))){e.preventDefault();ensureAudio();onStarTap(kbStar)}
  else if(/^[0-9]$/.test(k)){ensureAudio();const now=performance.now();kbBuf=(now-kbBufT<900?kbBuf:'')+k;kbBufT=now;
    const n=+kbBuf,hit=stars.find(x=>!x.collected&&x.n===n),longer=stars.some(x=>!x.collected&&String(x.n).startsWith(kbBuf)&&x.n!==n);
    if(hit&&!longer){kbStar=hit;onStarTap(hit);kbBuf=''}else if(hit){const b=kbBuf;setTimeout(()=>{if(kbBuf===b&&!hit.collected&&state==='play'){kbStar=hit;onStarTap(hit);kbBuf=''}},900)}}
});
canvas.addEventListener('pointerdown',()=>{kbHelp.hidden=true;kbStar=null},true);
/* sound may only start after a tap: the first tap anywhere wakes the audio */
(function(){const first=()=>{ensureAudio();['pointerdown','keydown'].forEach(t=>removeEventListener(t,first,true))};['pointerdown','keydown'].forEach(t=>addEventListener(t,first,true))})();
$('#nextBtn').onclick=()=>{sfx.pop();if(levelIdx<LEVELS.length-1)startLevel(levelIdx+1);else goTitle()};
$('#againBtn').onclick=()=>{sfx.pop();startLevel(levelIdx)};
$('#menuBtn').onclick=()=>{sfx.pop();goTitle()};
$('#mapLink').addEventListener('click',()=>{try{sessionStorage.setItem('ch-in','1')}catch(e){}});
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);fitCamera()});

/* ================= loop ================= */
const clock=new THREE.Clock();
function updateHero(h,dt,follow){
  let speed=0;
  if(follow){const d=new THREE.Vector3(follow.pos.x-h.pos.x,0,follow.pos.z-h.pos.z);const dist=d.length();if(dist>1.25){d.normalize();const sp=Math.min(4.4,(dist-1.05)*3.4);h.pos.addScaledVector(d,sp*dt);speed=sp;h.yaw=Math.atan2(d.x,d.z)}}
  else if(h.target){const d=new THREE.Vector3(h.target.x-h.pos.x,0,h.target.z-h.pos.z);const dist=d.length();if(dist<.06){h.target=null}else{d.normalize();const sp=Math.min(3.4,dist*5);h.pos.addScaledVector(d,sp*dt);speed=sp;h.yaw=Math.atan2(d.x,d.z)}}
  const gy=topAt(h.pos.x,h.pos.z);h.pos.y=lerp(h.pos.y,gy,Math.min(1,dt*12));
  h.moving=speed>.15;
  if(!h.moving&&h.cheer<=0){let dy=0-h.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));h.yaw+=dy*Math.min(1,dt*2.5)}
  let cur=h.root.rotation.y,dd=h.yaw-cur;dd=Math.atan2(Math.sin(dd),Math.cos(dd));h.root.rotation.y=cur+dd*Math.min(1,dt*10);
  h.phase+=dt*(h.moving?speed*3.2:2);
  const sw=h.moving?Math.sin(h.phase)*.75:0;
  h.legs[0].rotation.x=sw;h.legs[1].rotation.x=-sw;
  let jump=0;
  if(h.cheer>0){h.cheer-=dt;const t=performance.now()/1000;jump=Math.abs(Math.sin(t*7+h.phase))*.32;h.arms[0].rotation.z=-2.6+Math.sin(t*14)*.25;h.arms[1].rotation.z=2.6-Math.sin(t*14)*.25;h.arms[0].rotation.x=h.arms[1].rotation.x=0}
  else{h.arms[0].rotation.z=lerp(h.arms[0].rotation.z,-.08,dt*8);h.arms[1].rotation.z=lerp(h.arms[1].rotation.z,.08,dt*8);h.arms[0].rotation.x=-sw*.8;h.arms[1].rotation.x=sw*.8}
  if(h.hop>0){h.hop=Math.max(0,h.hop-dt*2.2);jump=Math.max(jump,Math.sin((1-h.hop)*Math.PI)*.35)}
  const bp=beatPhase(),kv=Math.pow(1-bp,3);if(h.talk>0)h.talk-=dt;const talking=h.talk>0&&!h.moving;
  h.body.position.y=jump+(h.moving?Math.abs(Math.sin(h.phase))*.05:kv*(talking?.07:.025));
  h.head.rotation.z=h.moving?0:(talking?Math.sin(bp*Math.PI*2)*.13:Math.sin(h.phase*.5)*.06);
  h.head.rotation.x=talking?-kv*.2:0;
  if(talking&&h.cheer<=0){h.arms[1].rotation.z=.15+kv*.6;h.arms[1].rotation.x=-.5}
  h.root.position.copy(h.pos);
}
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  // camera
  let yaw=.35,pitch=.98;
  if(state==='title'){titleT+=dt;yaw=.35+Math.sin(titleT*.12)*.5;pitch=.78}
  else if(!reduceMotion)yaw+=Math.sin(t*.15)*.03;
  camYaw=lerp(camYaw,yaw,Math.min(1,dt*2));
  const look=new THREE.Vector3(0,1.2,state==='title'?-1.2:.4);camLook.lerp(look,Math.min(1,dt*3));
  camera.position.set(camLook.x+Math.sin(camYaw)*Math.cos(pitch)*camDist,camLook.y+Math.sin(pitch)*camDist,camLook.z+Math.cos(camYaw)*Math.cos(pitch)*camDist);
  camera.lookAt(camLook);
  // heroes
  const c=chain();c.forEach((h,k)=>updateHero(h,dt,k?c[k-1]:null));
  if(state==='title'&&!c[0].target&&Math.random()<dt*.25){c[0].target=new THREE.Vector3((Math.random()-.5)*W*.5,0,(Math.random()-.5)*D*.4)}
  // stars
  for(const s of stars){s.t+=dt;s.scale=Math.min(1,s.scale+dt*2.5);
    const base=s.collected?.55:1;let sc=base*(s.scale<1?Math.sin(s.scale*Math.PI/2)*1.1:1);
    if(s.flash>0){s.flash=Math.max(0,s.flash-dt*1.6);sc*=1+s.flash*.6}
    s.st.scale.setScalar(sc);s.st.rotation.y+=dt*(s.collected?.6:1.4);
    s.grp.position.y=s.ground+1.35+Math.sin(s.t*2)*.08+(s.collected?.25:0);
    s.st.position.x=s.shake>0?Math.sin(s.shake*40)*.12*s.shake:0;if(s.shake>0)s.shake=Math.max(0,s.shake-dt);
    const pulse=(s.hinted?1+Math.sin(t*8)*.18:1)*(1+.08*Math.pow(1-beatPhase(),3));s.bd.scale.setScalar(.8*pulse*(s.collected?.8:1));s.bd.position.y=s.collected?.55:.82;
    s.gl.material.opacity=(s.collected?.55:.4+Math.sin(s.t*3)*.1)*(s.hinted?1.5:1);s.gl.scale.setScalar((s.collected?1.4:1.7)*(1+s.flash*.8));
    if(s.ar.visible)s.ar.position.y=1.55+Math.abs(Math.sin(t*5))*.25;
  }
  for(const m of trail)m.rotation.y+=dt;
  // hint clock
  if(state==='play'){hintClock+=dt;if(hintClock>11)hint()}
  // fx
  for(let k=fx.length-1;k>=0;k--){const f=fx[k];f.life-=dt;f.update(dt);if(f.life<=0){f.end();fx.splice(k,1)}}
  for(let k=tweens.length-1;k>=0;k--){const tw=tweens[k];tw.t+=dt;const v=Math.min(1,tw.t/tw.dur);tw.fn(v);if(v>=1){tweens.splice(k,1);tw.done&&tw.done()}}
  if(confetti){confetti.life-=dt;const d=new THREE.Object3D();confetti.ps.forEach((p,k)=>{p.p.addScaledVector(p.v,dt);p.p.x+=Math.sin(t*p.s+k)*dt*.6;p.r.x+=dt*p.s;p.r.y+=dt*p.s*.7;d.position.copy(p.p);d.rotation.copy(p.r);d.updateMatrix();confetti.mesh.setMatrixAt(k,d.matrix)});confetti.mesh.instanceMatrix.needsUpdate=true;if(confetti.life<=0){scene.remove(confetti.mesh);confetti=null}}
  clouds.children.forEach(cl=>{cl.position.x+=cl.userData.v*dt;if(cl.position.x>24)cl.position.x=-26});
  if(waterMesh)waterMesh.position.y=Math.sin(t*1.5)*.025;
  if(fireflies){const a=fireflies.geometry.attributes.position.array;fireflies.userData.seed.forEach((s,k)=>{a[k*3]=s[1]+Math.sin(t*.6+s[0])*1.2;a[k*3+1]=s[3]+Math.sin(t*1.3+s[0]*2)*.5;a[k*3+2]=s[2]+Math.cos(t*.5+s[0])*1.2});fireflies.geometry.attributes.position.needsUpdate=true;fireflies.material.opacity=.6+Math.sin(t*3)*.3}
  if(kbStar&&!kbStar.collected&&state==='play'){const p=starScreen(kbStar);kbRing.hidden=false;kbRing.style.left=p.x+'px';kbRing.style.top=p.y+'px'}
  else{kbRing.hidden=true;if(state!=='play')kbHelp.hidden=true}
  perfCheck(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
/* performance: if the first seconds of play run slowly (older tablets/phones),
   draw at 1x resolution instead of 2x. Hidden time is ignored. */
let perfN=0,perfSum=0,perfDone=false;
function perfCheck(dt){if(perfDone||document.hidden)return;perfN++;perfSum+=dt;
  if(perfN>=150){perfDone=true;const fps=perfN/perfSum;if(fps<40&&renderer.getPixelRatio()>1){renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight,false)}}}

/* ================= boot ================= */
renderer.setSize(innerWidth,innerHeight,false);
setMusic(musicOn);
const fontsReady=document.fonts&&document.fonts.load?Promise.race([Promise.all([document.fonts.load('700 64px Fredoka'),document.fonts.load('400 32px "Lilita One"')]),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontsReady.catch(()=>{}).then(()=>{goTitle();requestAnimationFrame(frame)});
})();
</script>
