<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shape Kingdom Rescue</title>
<style>
.sk{width:min(620px,100%);display:grid;gap:clamp(14px,3vh,26px);justify-items:center}
.moat{width:100%;padding:10px 10px 18px;border-radius:16px;background:linear-gradient(#3fa9e8,#2a7fc4);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.bridge{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;border-radius:10px;background:repeating-linear-gradient(90deg,#c48a52 0 26px,#a8703c 26px 29px);border:4px solid #6e4322;box-shadow:0 6px 0 rgba(42,31,61,.3);position:relative}
.gap{aspect-ratio:1;border-radius:10px;background:#3a2414;display:grid;place-items:center;padding:12%;box-shadow:inset 0 6px 0 rgba(0,0,0,.35);transition:background .3s}
.gap.on{background:#5a3a22;box-shadow:inset 0 6px 0 rgba(0,0,0,.35),0 0 0 4px #ffc93c,0 0 22px 6px rgba(255,201,60,.8);animation:kg-bob 1s ease-in-out infinite}
.gap.done{background:#e9c48f;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.gap svg{width:100%;height:100%}
.walker{position:absolute;top:-34px;left:-10px;display:flex;gap:2px;pointer-events:none}
.walker img{width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:#fff;object-fit:cover}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,14px);width:100%}
.tray .kg-card{aspect-ratio:1;padding:16%}
.tray .kg-card svg{width:100%;height:100%}
</style><link rel="stylesheet" href="css/theme.css"></head><body>
<script src="core/store.js"></script><script src="core/voice.js"></script><script src="core/ui.js"></script><script src="core/avatars.js"></script><script src="shared.js"></script>
<script>
const FACT={circle:'A circle is round, with no corners.',square:'A square has 4 sides that are all the same.',triangle:'A triangle has 3 sides and 3 corners.',rectangle:'A rectangle has 2 long sides and 2 short sides.',oval:'An oval looks like an egg.',diamond:'A diamond looks like a kite.',star:'A star has 5 points.',heart:'A heart means love!',hexagon:'A hexagon has 6 sides.'};
const A={circle:'a',square:'a',triangle:'a',rectangle:'a',oval:'an',diamond:'a',star:'a',heart:'a',hexagon:'a'};
const BASIC=['circle','square','triangle','rectangle'],EXTRA=['oval','diamond','star','heart','hexagon'];
const COLS=Object.values(KG.COLORS);
KG.game({id:'shapes',title:'Shape Kingdom Rescue',tag:'Shapes',scene:'castle',song:'march',rounds:8,
  skill:'Practice: circle, square, triangle, rectangle, oval, diamond, star, heart, hexagon',
  blurb:'A grumpy wizard broke the castle bridge! Find the right shape blocks to fix every hole.',
  intro:{who:'wynea',text:'Oh no! A grumpy wizard broke the castle bridge!'},
  winTitle:'Bridge Fixed!',winText:'You know your shapes! The whole kingdom can cross now.',winSay:'Hooray! The bridge is fixed! You know all your shapes!',
  build(stage,api){
    stage.innerHTML='<div class="sk"><div class="moat"><div class="bridge" id="bridge"></div></div><div class="tray" id="tray"></div></div>';
    const bridge=KG.$('#bridge'),tray=KG.$('#tray');let set=[];
    function newBridge(level){const kinds=level?KG.shuffle(EXTRA).slice(0,3).concat(KG.pick(BASIC)):KG.shuffle(BASIC);set=KG.shuffle(kinds).map(k=>({k,c:KG.pick(COLS),rot:level&&(k==='triangle'||k==='rectangle'||k==='heart')?KG.pick([0,90,180,270]):0,done:false}));}
    function draw(slot){bridge.innerHTML='';set.forEach((s,i)=>{const g=KG.el('div','gap'+(s.done?' done':'')+(i===slot?' on':''),s.done?KG.shapeSVG(s.k,s.c,{rot:s.rot}):KG.shapeSVG(s.k,'',{outline:true,rot:s.rot}));bridge.appendChild(g)})}
    return{round(i){
      const slot=i%4;if(slot===0)newBridge(i>=4);draw(slot);
      const t=set[slot],pool=(i>=4?EXTRA.concat(BASIC):BASIC.concat(['oval','star'])).filter(k=>k!==t.k);
      const opts=KG.shuffle([t.k].concat(KG.shuffle(pool).slice(0,3)));
      tray.innerHTML='';
      opts.forEach(k=>{const col=k===t.k?t.c:KG.pick(COLS);const b=KG.el('button','kg-card',KG.shapeSVG(k,col,{rot:k===t.k?t.rot:0}));b.setAttribute('aria-label',k);
        b.onclick=()=>{if(api.locked)return;
          if(k===t.k){api.lock();const gap=bridge.children[slot];b.style.visibility='hidden';KG.sfx.whoosh();
            KG.fly(b,gap,KG.shapeSVG(k,col,{rot:t.rot})).then(()=>{t.done=true;t.c=col;draw(-1);const g=bridge.children[slot];
              const last=slot===3;api.correct({force:true,el:g,line:`${A[k]==='an'?'An':'A'} <b>${k}</b>! ${FACT[k]}${last?' The bridge is fixed!':''}`,delay:last?3600:2600});
              if(last){const w=KG.el('div','walker',KG.ORDER.map(id=>`<img src="${KG.HEROES[id].head}" alt="">`).join(''));bridge.appendChild(w);w.animate([{transform:'translateX(0)'},{transform:`translateX(${bridge.clientWidth-120}px)`}],{duration:2600,easing:'ease-in-out',fill:'forwards'})}})}
          else{const n=api.wrong({el:b,line:`That's ${A[k]} ${k}. We need ${A[t.k]} <b>${t.k}</b>! ${FACT[t.k]}`});if(n>=2)[...tray.children].forEach(x=>{if(x.getAttribute('aria-label')===t.k)x.classList.add('glow')})}};
        tray.appendChild(b)});
      const who=api.hero(i);
      api.prompt(who,i===0?`Find the <b>${t.k}</b> to fix the glowing hole!`:KG.pick([`Now find the <b>${t.k}</b>!`,`Can you find the <b>${t.k}</b>?`,`Where is the <b>${t.k}</b>?`]));
    }};
  }});
</script>
</body></html>
