<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treasure of Coconut Island</title>
<style>
.ti{width:min(700px,100%);display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:clamp(8px,2.5vw,20px)}
.chest{border:0;background:none;padding:0;display:grid;justify-items:center;gap:8px;transition:transform .15s}
.chest:active{transform:scale(.97)}
.lid{width:92%;height:clamp(26px,6vh,44px);background:linear-gradient(#b5793f,#8a5528);border:4px solid #4a2c16;border-bottom:0;border-radius:18px 18px 4px 4px;transform:perspective(300px) rotateX(28deg);transform-origin:bottom;box-shadow:inset 0 5px 0 rgba(255,255,255,.2)}
.box{width:100%;aspect-ratio:1.25;background:repeating-linear-gradient(180deg,#a8693a 0 18%,#8a5528 18% 21%);border:4px solid #4a2c16;border-radius:6px 6px 12px 12px;position:relative;box-shadow:0 8px 0 rgba(42,31,61,.3);display:grid;place-items:center;padding:8% 6% 14%}
.box::after{content:"";position:absolute;left:44%;bottom:6%;width:12%;height:18%;background:#ffc93c;border:3px solid #4a2c16;border-radius:4px}
.coins{width:100%;height:100%;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:min-content;align-content:center;gap:4px}
.coin{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc93c 45%,#d98f0b);border:3px solid #9c6408;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.coin.hl{transform:scale(1.25);box-shadow:0 0 12px 4px #fff3b0}
.count{font-family:var(--display);font-size:clamp(1.3rem,4vw,1.8rem);color:#fff;background:rgba(42,31,61,.55);padding:.1em .7em;border-radius:999px;min-width:2.4em;text-align:center;visibility:hidden}
.count.show{visibility:visible}
.same{width:clamp(70px,16vw,110px);aspect-ratio:1;align-self:center;font-family:var(--display);font-size:clamp(2.2rem,8vw,3.6rem);color:var(--sky-d)}
.same span{font-size:.32em;display:block;font-family:var(--body);font-weight:700;color:var(--ink)}
.spacer{width:clamp(20px,5vw,40px)}
</style><link rel="stylesheet" href="css/theme.css"></head><body>
<script src="core/store.js"></script><script src="core/voice.js"></script><script src="core/ui.js"></script><script src="core/avatars.js"></script><script src="shared.js"></script>
<script>
const Q=['more','fewer','more','same','fewer','more','fewer','same','more','fewer'];
function counts(i,q){if(q==='same'){const n=KG.rnd(2,i<5?6:9);return[n,n]}const diff=i<4?KG.rnd(3,5):i<7?KG.rnd(2,3):1;const lo=KG.rnd(1,Math.max(1,10-diff-(i<4?2:0)));const pair=[lo,lo+diff];return KG.shuffle(pair)}
KG.game({id:'treasure',title:'Treasure of Coconut Island',tag:'Comparing',scene:'beach',song:'island',rounds:10,
  skill:'Practice: more, fewer and the same with groups up to 10',
  blurb:'The friends found pirate treasure on Coconut Island! Look at the chests and pick the one the parrot asks for.',
  intro:{who:'wynea',text:'Ahoy! We found treasure chests on Coconut Island!'},
  winTitle:'Treasure Found!',winText:'You can tell more, fewer and the same. A real pirate captain!',winSay:'Ahoy! You found all the treasure! Great comparing!',
  build(stage,api){
    stage.innerHTML='<div class="ti"><button class="chest" id="c0"><span class="count"></span><div class="lid"></div><div class="box"><div class="coins"></div></div></button><button class="kg-card same" id="same" hidden>=<span>Same</span></button><div class="spacer" id="sp"></div><button class="chest" id="c1"><span class="count"></span><div class="lid"></div><div class="box"><div class="coins"></div></div></button></div>';
    const ch=[KG.$('#c0'),KG.$('#c1')],same=KG.$('#same'),sp=KG.$('#sp');let cur;
    function fill(el,n){const c=el.querySelector('.coins');c.innerHTML='';for(let k=0;k<n;k++)c.appendChild(KG.el('div','coin'));el.querySelector('.count').textContent=n;el.querySelector('.count').classList.remove('show');el.setAttribute('aria-label',n+' coins')}
    function countUp(el,n,done){const cs=[...el.querySelectorAll('.coin')];const lbl=el.querySelector('.count');lbl.textContent='0';lbl.classList.add('show');api.beats(n,k=>{cs.forEach(c=>c.classList.remove('hl'));cs[k].classList.add('hl');lbl.textContent=k+1;KG.sfx.count(k)},2);setTimeout(done,KG.secToNext(2)*1000+n*api.beatLen()/2*1000+300)}
    function answer(pick){if(api.locked)return;const[a,b]=cur.n,q=cur.q;let ok;
      if(q==='same')ok=pick==='same';else if(pick==='same')ok=false;else{const mine=cur.n[pick],other=cur.n[1-pick];ok=q==='more'?mine>other:mine<other}
      if(ok){api.lock();const el=pick==='same'?same:ch[pick];
        const finish=()=>{let line;if(q==='same')line=`Both have ${a}. They are the <b>same</b>!`;else{const m=cur.n[pick],o=cur.n[1-pick];line=`${m} is <b>${q==='more'?'more':'fewer'}</b> than ${o}!`}
          ch.forEach((c,k)=>{c.querySelector('.count').textContent=cur.n[k];c.querySelector('.count').classList.add('show')});KG.sfx.coin();api.correct({force:true,el,line,delay:2600})};
        if(pick==='same')finish();else countUp(ch[pick],cur.n[pick],finish)}
      else{const el=pick==='same'?same:ch[pick];const n=api.wrong({el,line:q==='same'?'Count both chests. Do they have the same?':`Look again! Which chest has <b>${q}</b> coins?`});if(n>=2){ch.forEach((c,k)=>{c.querySelector('.count').classList.add('show')})}}}
    ch.forEach((c,k)=>c.onclick=()=>answer(k));same.onclick=()=>answer('same');
    return{round(i){const q=Q[i];cur={q,n:counts(i,q)};fill(ch[0],cur.n[0]);fill(ch[1],cur.n[1]);const showSame=i>=3;same.hidden=!showSame;sp.hidden=showSame;
      const who=api.hero(i);
      api.prompt(who,q==='more'?KG.pick(['Which chest has <b>more</b> coins?','Tap the chest with <b>more</b> treasure!']):q==='fewer'?KG.pick(['Which chest has <b>fewer</b> coins?','Tap the chest with <b>fewer</b> coins!']):'Hmm! Do these chests have more, fewer, or the <b>same</b>?');
    }};
  }});
</script>
</body></html>
